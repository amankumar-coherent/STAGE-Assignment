[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-agent"
version = "1.0.0"
description = "One User, One Agent: per-viewer decide / verify / act / measure loop (STAGE take-home)"
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.scripts]
stage-agent = "stage_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
